<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>智能笔记 - Smart Notes</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
    <link rel="stylesheet" href="css/style.css">
    <!-- iOS Safari fullscreen support -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
</head>
<body>
    <div class="app-wrapper">
        <!-- Mobile Header -->
        <header class="mobile-header">
            <button class="mobile-menu-btn" id="mobileMenuBtn">
                <i class="fas fa-bars"></i>
            </button>
            <span class="mobile-title" id="mobileTitle">待办清单</span>
            <button class="mobile-menu-btn" id="mobileThemeBtn">
                <i class="fas fa-sun"></i>
            </button>
        </header>

        <!-- Sidebar Overlay -->
        <div class="sidebar-overlay" id="sidebarOverlay"></div>

        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <i class="fas fa-feather-alt"></i>
                    <span class="logo-text">智能笔记</span>
                </div>
                <button class="sidebar-toggle" id="sidebarToggle" title="收起侧边栏">
                    <i class="fas fa-chevron-left"></i>
                </button>
            </div>

            <nav class="sidebar-nav">
                <a href="#" class="nav-item active" data-page="notes">
                    <i class="fas fa-clipboard-check"></i>
                    <span>待办清单</span>
                </a>
                <a href="#" class="nav-item" data-page="ideas">
                    <i class="fas fa-lightbulb"></i>
                    <span>想法记录</span>
                </a>
            </nav>

            <div class="sidebar-footer">
                <div class="user-profile">
                    <div class="avatar">
                        <i class="fas fa-user"></i>
                    </div>
                    <div class="user-info">
                        <span class="user-name" id="userEmail"></span>
                        <span class="user-status">在线</span>
                    </div>
                </div>
                <div class="sidebar-actions">
                    <button class="icon-btn" id="themeBtn" title="切换主题">
                        <i class="fas fa-sun"></i>
                    </button>
                    <button class="icon-btn" id="settingsBtn" title="设置">
                        <i class="fas fa-cog"></i>
                    </button>
                    <button class="icon-btn" id="logoutBtn" title="退出登录">
                        <i class="fas fa-sign-out-alt"></i>
                    </button>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Notes Page -->
            <div class="page active" id="notesPage">
                <div class="page-container">
                    <!-- Page Header -->
                    <header class="page-header">
                        <div class="page-title">
                            <h1><i class="fas fa-clipboard-check"></i> 待办清单</h1>
                            <p class="page-subtitle">管理您的任务，提高效率</p>
                        </div>
                        <div class="header-stats">
                            <div class="stat-card">
                                <div class="stat-icon"><i class="fas fa-list-check"></i></div>
                                <div class="stat-info">
                                    <span class="stat-value" id="totalCount">0</span>
                                    <span class="stat-label">总计</span>
                                </div>
                            </div>
                            <div class="stat-card success">
                                <div class="stat-icon"><i class="fas fa-check-circle"></i></div>
                                <div class="stat-info">
                                    <span class="stat-value" id="completedCount">0</span>
                                    <span class="stat-label">已完成</span>
                                </div>
                            </div>
                            <div class="stat-card warning">
                                <div class="stat-icon"><i class="fas fa-clock"></i></div>
                                <div class="stat-info">
                                    <span class="stat-value" id="pendingCount">0</span>
                                    <span class="stat-label">进行中</span>
                                </div>
                            </div>
                        </div>
                    </header>

                    <!-- Action Bar -->
                    <div class="action-bar">
                        <button id="addNoteBtn" class="btn btn-primary">
                            <i class="fas fa-plus"></i>
                            <span>新建待办</span>
                        </button>
                        <div class="action-group">
                            <button id="completeAllBtn" class="btn btn-ghost" title="一键完成所有">
                                <i class="fas fa-check-double"></i>
                            </button>
                            <button id="exportBtn" class="btn btn-ghost" title="导出">
                                <i class="fas fa-download"></i>
                            </button>
                            <button id="importBtn" class="btn btn-ghost" title="导入">
                                <i class="fas fa-upload"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Filters & Search -->
                    <div class="filters-bar">
                        <div class="search-wrapper">
                            <i class="fas fa-search"></i>
                            <input type="text" id="searchInput" placeholder="搜索待办事项...">
                        </div>
                        <div class="filter-pills">
                            <button class="pill active" data-filter="all">全部</button>
                            <button class="pill" data-filter="active">进行中</button>
                            <button class="pill" data-filter="completed">已完成</button>
                            <button class="pill" data-filter="important">
                                <i class="fas fa-star"></i> 重要
                            </button>
                            <button class="pill" data-filter="today">今天</button>
                        </div>
                        <div class="filter-selects">
                            <select id="categoryFilterSelect" class="select-minimal">
                                <option value="">所有分类</option>
                            </select>
                            <select id="sortSelect" class="select-minimal">
                                <option value="newest">最新创建</option>
                                <option value="oldest">最早创建</option>
                                <option value="priority">优先级</option>
                                <option value="dueDate">截止日期</option>
                            </select>
                        </div>
                    </div>

                    <!-- Notes Grid -->
                    <div id="notesContainer" class="notes-grid"></div>

                    <!-- Empty State -->
                    <div id="emptyState" class="empty-state" style="display: none;">
                        <div class="empty-icon">
                            <i class="fas fa-clipboard-list"></i>
                        </div>
                        <h3>暂无待办事项</h3>
                        <p>点击"新建待办"开始记录您的任务</p>
                        <button class="btn btn-primary" onclick="document.getElementById('addNoteBtn').click()">
                            <i class="fas fa-plus"></i> 创建第一个待办
                        </button>
                    </div>

                    <!-- Pagination -->
                    <div id="paginationContainer" class="pagination" style="display: none;">
                        <select id="perPageSelect" class="select-minimal">
                            <option value="6">6条/页</option>
                            <option value="9" selected>9条/页</option>
                            <option value="12">12条/页</option>
                            <option value="15">15条/页</option>
                        </select>
                        <div class="page-controls">
                            <button id="prevPage" class="btn btn-icon" disabled>
                                <i class="fas fa-chevron-left"></i>
                            </button>
                            <span class="page-info" id="pageInfo">第 1 / 1 页</span>
                            <button id="nextPage" class="btn btn-icon">
                                <i class="fas fa-chevron-right"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Ideas Page -->
            <div class="page" id="ideasPage">
                <div class="page-container">
                    <!-- Page Header -->
                    <header class="page-header">
                        <div class="page-title">
                            <h1><i class="fas fa-lightbulb"></i> 想法记录</h1>
                            <p class="page-subtitle">随时捕捉灵感，记录思考</p>
                        </div>
                        <div class="header-stats">
                            <div class="stat-card idea">
                                <div class="stat-icon"><i class="fas fa-brain"></i></div>
                                <div class="stat-info">
                                    <span class="stat-value" id="ideasTotalCount">0</span>
                                    <span class="stat-label">想法总数</span>
                                </div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-icon"><i class="fas fa-calendar-week"></i></div>
                                <div class="stat-info">
                                    <span class="stat-value" id="ideasThisWeek">0</span>
                                    <span class="stat-label">本周新增</span>
                                </div>
                            </div>
                        </div>
                    </header>

                    <!-- Action Bar -->
                    <div class="action-bar">
                        <button id="addIdeaBtn" class="btn btn-primary btn-idea">
                            <i class="fas fa-plus"></i>
                            <span>记录想法</span>
                        </button>
                        <div class="action-group">
                            <button id="exportIdeasBtn" class="btn btn-ghost" title="导出想法">
                                <i class="fas fa-download"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Filters & Search -->
                    <div class="filters-bar">
                        <div class="search-wrapper">
                            <i class="fas fa-search"></i>
                            <input type="text" id="ideaSearchInput" placeholder="搜索想法...">
                        </div>
                        <div class="filter-selects">
                            <select id="ideaCategoryFilter" class="select-minimal">
                                <option value="">所有分类</option>
                            </select>
                            <select id="ideaSortSelect" class="select-minimal">
                                <option value="newest">最新记录</option>
                                <option value="oldest">最早记录</option>
                            </select>
                        </div>
                    </div>

                    <!-- Ideas List -->
                    <div id="ideasContainer" class="ideas-list"></div>

                    <!-- Empty State -->
                    <div id="ideasEmptyState" class="empty-state" style="display: none;">
                        <div class="empty-icon idea">
                            <i class="fas fa-lightbulb"></i>
                        </div>
                        <h3>还没有记录任何想法</h3>
                        <p>点击"记录想法"开始捕捉您的灵感</p>
                        <button class="btn btn-primary btn-idea" onclick="document.getElementById('addIdeaBtn').click()">
                            <i class="fas fa-plus"></i> 记录第一个想法
                        </button>
                    </div>

                    <!-- Pagination -->
                    <div id="ideasPaginationContainer" class="pagination" style="display: none;">
                        <select id="ideasPerPageSelect" class="select-minimal">
                            <option value="10" selected>10条/页</option>
                            <option value="20">20条/页</option>
                            <option value="50">50条/页</option>
                        </select>
                        <div class="page-controls">
                            <button id="ideasPrevPage" class="btn btn-icon" disabled>
                                <i class="fas fa-chevron-left"></i>
                            </button>
                            <span class="page-info" id="ideasPageInfo">第 1 / 1 页</span>
                            <button id="ideasNextPage" class="btn btn-icon">
                                <i class="fas fa-chevron-right"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Note Modal -->
    <div id="noteModal" class="modal">
        <div class="modal-overlay"></div>
        <div class="modal-container">
            <div class="modal-header">
                <h2 id="modalTitle">新建待办</h2>
                <button class="modal-close">&times;</button>
            </div>
            <form id="noteForm" class="modal-body">
                <div class="form-group">
                    <label for="noteTitle">
                        <i class="fas fa-heading"></i> 标题 <span class="required">*</span>
                    </label>
                    <input type="text" id="noteTitle" required placeholder="输入待办标题">
                </div>

                <div class="form-group">
                    <label for="noteContent">
                        <i class="fas fa-align-left"></i> 内容 <span class="required">*</span>
                    </label>
                    <textarea id="noteContent" rows="4" required placeholder="输入待办详细内容"></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label><i class="fas fa-palette"></i> 颜色</label>
                        <div class="color-picker" id="colorPicker">
                            <div class="color-option selected" data-color="" title="默认">
                                <i class="fas fa-ban"></i>
                            </div>
                            <div class="color-option" data-color="#6366f1" style="background: #6366f1;" title="紫色"></div>
                            <div class="color-option" data-color="#3b82f6" style="background: #3b82f6;" title="蓝色"></div>
                            <div class="color-option" data-color="#10b981" style="background: #10b981;" title="绿色"></div>
                            <div class="color-option" data-color="#ef4444" style="background: #ef4444;" title="红色"></div>
                            <div class="color-option" data-color="#f97316" style="background: #f97316;" title="橙色"></div>
                            <div class="color-option" data-color="#ec4899" style="background: #ec4899;" title="粉色"></div>
                            <div class="color-option" data-color="#06b6d4" style="background: #06b6d4;" title="青色"></div>
                            <div class="color-option" data-color="#f59e0b" style="background: #f59e0b;" title="黄色"></div>
                        </div>
                        <input type="hidden" id="noteColor">
                    </div>

                    <div class="form-group">
                        <label><i class="fas fa-file-alt"></i> 格式</label>
                        <div class="format-toggle">
                            <label class="toggle-option">
                                <input type="radio" name="noteFormat" value="text" checked>
                                <span><i class="fas fa-font"></i> 纯文本</span>
                            </label>
                            <label class="toggle-option">
                                <input type="radio" name="noteFormat" value="markdown">
                                <span><i class="fab fa-markdown"></i> Markdown</span>
                            </label>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label class="checkbox-fancy">
                        <input type="checkbox" id="noteImportant">
                        <span class="checkbox-box"><i class="fas fa-star"></i></span>
                        <span>标记为重要</span>
                    </label>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="noteCategory"><i class="fas fa-folder"></i> 分类</label>
                        <input type="text" id="noteCategory" placeholder="如：工作、学习、生活">
                    </div>
                    <div class="form-group">
                        <label for="notePriority"><i class="fas fa-flag"></i> 优先级</label>
                        <select id="notePriority">
                            <option value="low">低</option>
                            <option value="medium" selected>中</option>
                            <option value="high">高</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="noteTags"><i class="fas fa-tags"></i> 标签</label>
                    <input type="text" id="noteTags" placeholder="输入标签，用逗号分隔">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="noteDueDate"><i class="fas fa-calendar-alt"></i> 截止日期</label>
                        <input type="datetime-local" id="noteDueDate">
                    </div>
                    <div class="form-group">
                        <label for="noteReminderDate"><i class="fas fa-bell"></i> 提醒时间</label>
                        <input type="datetime-local" id="noteReminderDate">
                    </div>
                </div>

                <div class="form-group">
                    <label><i class="fas fa-paper-plane"></i> 提醒方式</label>
                    <div class="checkbox-group">
                        <label class="checkbox-item">
                            <input type="checkbox" name="reminderMethod" value="email" checked>
                            <span><i class="fas fa-envelope"></i> 邮件</span>
                        </label>
                        <label class="checkbox-item">
                            <input type="checkbox" name="reminderMethod" value="telegram">
                            <span><i class="fab fa-telegram"></i> Telegram</span>
                        </label>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary modal-cancel">取消</button>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save"></i> 保存
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Idea Modal -->
    <div id="ideaModal" class="modal">
        <div class="modal-overlay"></div>
        <div class="modal-container modal-idea">
            <div class="modal-header">
                <h2 id="ideaModalTitle">记录想法</h2>
                <button class="modal-close">&times;</button>
            </div>
            <form id="ideaForm" class="modal-body">
                <div class="form-group">
                    <label for="ideaTitle">
                        <i class="fas fa-lightbulb"></i> 标题 <span class="required">*</span>
                    </label>
                    <input type="text" id="ideaTitle" required placeholder="给想法起个名字">
                </div>

                <div class="form-group">
                    <label for="ideaContent">
                        <i class="fas fa-pen"></i> 内容 <span class="required">*</span>
                    </label>
                    <textarea id="ideaContent" rows="6" required placeholder="记录您的想法...支持Markdown格式"></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="ideaCategory"><i class="fas fa-layer-group"></i> 分类</label>
                        <input type="text" id="ideaCategory" list="ideaCategoryList" placeholder="输入或选择分类">
                        <datalist id="ideaCategoryList">
                            <option value="灵感">
                            <option value="学习">
                            <option value="工作">
                            <option value="生活">
                            <option value="技术">
                            <option value="产品">
                        </datalist>
                    </div>
                    <div class="form-group">
                        <label for="ideaTags"><i class="fas fa-tags"></i> 标签</label>
                        <input type="text" id="ideaTags" placeholder="用逗号分隔">
                    </div>
                </div>

                <div class="form-group">
                    <label><i class="fas fa-palette"></i> 颜色标记</label>
                    <div class="color-picker" id="ideaColorPicker">
                        <div class="color-option selected" data-color="" title="默认">
                            <i class="fas fa-ban"></i>
                        </div>
                        <div class="color-option" data-color="#f59e0b" style="background: #f59e0b;" title="黄色"></div>
                        <div class="color-option" data-color="#10b981" style="background: #10b981;" title="绿色"></div>
                        <div class="color-option" data-color="#3b82f6" style="background: #3b82f6;" title="蓝色"></div>
                        <div class="color-option" data-color="#8b5cf6" style="background: #8b5cf6;" title="紫色"></div>
                        <div class="color-option" data-color="#ec4899" style="background: #ec4899;" title="粉色"></div>
                    </div>
                    <input type="hidden" id="ideaColor">
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary modal-cancel">取消</button>
                    <button type="submit" class="btn btn-primary btn-idea">
                        <i class="fas fa-save"></i> 保存想法
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settingsModal" class="modal">
        <div class="modal-overlay"></div>
        <div class="modal-container modal-settings">
            <div class="modal-header">
                <h2>设置</h2>
                <button class="modal-close">&times;</button>
            </div>
            <div class="modal-body">
                <div class="settings-tabs">
                    <button class="tab-btn active" data-tab="password">
                        <i class="fas fa-key"></i> 修改密码
                    </button>
                    <button class="tab-btn" data-tab="data">
                        <i class="fas fa-database"></i> 数据管理
                    </button>
                </div>

                <div class="tab-content">
                    <!-- Password Tab -->
                    <div class="tab-pane active" id="passwordTab">
                        <form id="changePasswordForm">
                            <div class="form-group">
                                <label for="oldPassword"><i class="fas fa-lock"></i> 当前密码</label>
                                <input type="password" id="oldPassword" required placeholder="输入当前密码">
                            </div>
                            <div class="form-group">
                                <label for="newPassword"><i class="fas fa-key"></i> 新密码</label>
                                <input type="password" id="newPassword" required placeholder="输入新密码（至少6位）" minlength="6">
                            </div>
                            <div class="form-group">
                                <label for="confirmPassword"><i class="fas fa-check-circle"></i> 确认密码</label>
                                <input type="password" id="confirmPassword" required placeholder="再次输入新密码">
                            </div>
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save"></i> 修改密码
                            </button>
                        </form>
                    </div>

                    <!-- Data Tab -->
                    <div class="tab-pane" id="dataTab">
                        <div class="data-cards">
                            <div class="data-card">
                                <div class="data-card-icon"><i class="fas fa-download"></i></div>
                                <h3>导出数据</h3>
                                <p>将所有便签导出为JSON文件</p>
                                <button id="exportDataBtn" class="btn btn-secondary">
                                    <i class="fas fa-download"></i> 导出
                                </button>
                            </div>
                            <div class="data-card">
                                <div class="data-card-icon"><i class="fas fa-upload"></i></div>
                                <h3>导入数据</h3>
                                <p>从JSON文件导入便签</p>
                                <input type="file" id="importFileInput" accept=".json" style="display: none;">
                                <button id="importFileBtn" class="btn btn-secondary">
                                    <i class="fas fa-upload"></i> 选择文件
                                </button>
                            </div>
                        </div>
                        <div class="import-options" id="importOptions" style="display: none;">
                            <h4>导入策略</h4>
                            <div class="radio-group">
                                <label class="radio-item">
                                    <input type="radio" name="importStrategy" value="merge" checked>
                                    <span class="radio-box"></span>
                                    <span><i class="fas fa-layer-group"></i> 合并 - 保留现有便签并添加新便签</span>
                                </label>
                                <label class="radio-item">
                                    <input type="radio" name="importStrategy" value="replace">
                                    <span class="radio-box"></span>
                                    <span><i class="fas fa-sync-alt"></i> 覆盖 - 清空现有便签并导入新便签</span>
                                </label>
                            </div>
                            <button id="confirmImportBtn" class="btn btn-primary">
                                <i class="fas fa-check"></i> 确认导入
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bottom Navigation (Mobile) -->
    <nav class="bottom-nav" id="bottomNav">
        <a href="#" class="bottom-nav-item active" data-page="notes">
            <i class="fas fa-clipboard-check"></i>
            <span>待办</span>
        </a>
        <a href="#" class="bottom-nav-item" data-page="ideas">
            <i class="fas fa-lightbulb"></i>
            <span>想法</span>
        </a>
        <a href="#" class="bottom-nav-item" id="bottomSettingsBtn">
            <i class="fas fa-cog"></i>
            <span>设置</span>
        </a>
    </nav>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
