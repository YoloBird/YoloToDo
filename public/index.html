<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 智能便签系统</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@400;600;700&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
    <div class="auth-container">
        <!-- 头部 -->
        <div class="auth-header">
            <div class="auth-logo">
                <i class="fas fa-clipboard-check"></i>
            </div>
            <h1>智能便签系统</h1>
            <p>高效管理您的工作与生活</p>
        </div>

        <!-- 登录表单 -->
        <form id="loginForm" class="auth-form active">
            <div class="form-group">
                <label for="loginUsername">
                    <i class="fas fa-user"></i>
                    用户名
                </label>
                <input
                    type="text"
                    id="loginUsername"
                    required
                    placeholder="请输入用户名"
                    autocomplete="username"
                >
            </div>

            <div class="form-group">
                <label for="loginPassword">
                    <i class="fas fa-lock"></i>
                    密码
                </label>
                <input
                    type="password"
                    id="loginPassword"
                    required
                    placeholder="请输入密码"
                    autocomplete="current-password"
                >
            </div>

            <button type="submit" class="btn btn-primary auth-submit">
                <i class="fas fa-sign-in-alt"></i>
                登录
            </button>

            <div id="loginError" class="error-message"></div>
        </form>

        <!-- 提示信息 -->
        <div class="auth-footer">
            <p class="hint-text">
                <i class="fas fa-info-circle"></i>
                仅限本人使用，请妥善保管账号密码
            </p>
            <p class="copyright">© 2025 智能便签系统</p>
        </div>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
