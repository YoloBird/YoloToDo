version: '3.8'

services:
  todo-app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - JWT_SECRET=todo_app_secret_key_change_in_production_2025
      - APP_URL=http://localhost:3000
    volumes:
      - ./server/data:/app/server/data
    restart: unless-stopped
